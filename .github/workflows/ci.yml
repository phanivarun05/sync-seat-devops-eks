name: Blank Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ======================================================
  # JOB 1: Automated Node.js Linting & Testing
  # ======================================================
  node-tests:
    # Keeps your excellent GitOps guard so image tag updates don't trigger infinite build loops
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Node.js Linting & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies cleanly
        run: npm install

      - name: Run Test Suites Safely
          # This checks if package.json contains the default boilerplate. 
          # If it finds "no test specified", it prints a warning and skips execution cleanly.
        run: |
          if grep -q "no test specified" package.json; then
            echo "⚠️ [DevOps Alert] No tests defined by development team for this microservice. Skipping step."
          else
            npm test
          fi
