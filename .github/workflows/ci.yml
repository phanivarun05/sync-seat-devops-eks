name: Blank Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ======================================================
  # JOB 1: Automated Node.js Linting & Testing
  # ======================================================
  node-tests:
    # Keeps your excellent GitOps guard so image tag updates don't trigger infinite build loops
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Node.js Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Array of your specific application microservice directory names
        service: [api-gateway, booking, mail, homepage]

    defaults:
      run:
        # Dynamically steps into each microservice folder context
        working-directory: syncseatapp/Backend/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Matches the native V8 runtime from your production Dockerfiles
          # Automatically caches node_modules dependencies based on your package.json files
          cache: 'npm'
          cache-dependency-path: syncseatapp/Backend/${{ matrix.service }}/package.json

      - name: Install dependencies cleanly
        # Safe production-grade installation loop
        run: npm install

      - name: Run Test Suites
        # Executes testing blocks. If no tests are configured yet in a script block, 
        # it will cleanly pass through based on your generic "exit 1" fallback logic.
        run: npm test --if-present
