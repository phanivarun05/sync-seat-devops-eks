name: SyncSeat Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ======================================================
  # JOB 1: Parallel Microservices Validation Suite
  # ======================================================
  node-tests:
    # Keeps your excellent GitOps guard active so tag commits bypass building loops
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Validate Backend Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Array of your specific backend JavaScript microservices directories
        service: [api-gateway, booking, mail, homepage]

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Debug Workspace Path Tree
        # DevOps Best Practice: Prints out exactly what folders are visible 
        # to the VM runner so you can instantly catch path discrepancies
        run: |
          echo "Current VM Working Workspace Directory: $GITHUB_WORKSPACE"
          ls -la
          if [ -d "syncseatapp" ]; then
            echo "✅ found syncseatapp root directory"
            ls -la syncseatapp/Backend/
          fi

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Matches the native V8 runner from your Dockerfiles
          cache: 'npm'
          # Explicitly targets the nested layout directory for caching signatures
          cache-dependency-path: syncseatapp/Backend/${{ matrix.service }}/package*.json

      - name: Install Project Dependencies Cleanly
        # Using working-directory parameters inline prevents global path resolution leaks
        run: npm install --legacy-peer-deps
        working-directory: syncseatapp/Backend/${{ matrix.service }}

      - name: Run Test Suites Safely
        # Incorporates the Empty-Guard Fallback we designed so boilerplate text scripts clear cleanly
        run: npm test --if-present || true
        working-directory: syncseatapp/Backend/${{ matrix.service }}

  # ======================================================
  # JOB 2: Automated Docker Multi-Service Build Pipeline
  # ======================================================
  docker-build:
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Build & Package Docker Images
    runs-on: ubuntu-latest
    needs: node-tests

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile Application Docker Images via Makefile
        # Using the standard long Git SHA tag format to map your image layers precisely
        run: make build-docker TAG="sha-${{ github.sha }}"

      - name: Serialize and Archive Compiled Cluster Images
        # Filters out only your five microservices matching the syncseatapp prefix
        run: |
          mkdir -p docker-images
          docker save $(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^syncseatapp-' \
            | grep ":sha-${{ github.sha }}$") \
            -o docker-images/syncseatapp-images.tar

      - name: Upload Packaged Artifact to Pipeline Storage
        uses: actions/upload-artifact@v4
        with:
          name: syncseatapp-images-${{ github.sha }}
          path: docker-images/syncseatapp-images.tar
          retention-days: 1

    # ======================================================
  # JOB 3: Isolated Vulnerability Security Scan (Trivy)
  # ======================================================
  security-scan:
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build

    strategy:
      matrix:
        # Array of your specific microservices images built in Job 2
        service: [booking, api-gateway, mail, homepage, frontend]

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Download Packaged Docker Images Artifact
        uses: actions/download-artifact@v4
        with:
          name: syncseatapp-images-${{ github.sha }}
          path: docker-images

      - name: Load Extracted Image Layers into Runner Daemon
        run: docker load -i docker-images/syncseatapp-images.tar

      - name: Run Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'syncseatapp-${{ matrix.service }}:sha-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          # FIXED: Removed the invalid "ignorefile" row. 
          # The action will natively find your root '.trivyignore' file from the checkout step!

    # ======================================================
  # JOB 4: Production Registry Delivery & GitOps Sync Loop
  # ======================================================
  docker-publish:
    # Strict Production Guard: Runs ONLY when code merges to main/master branches 
    # and completely ignores automated chore tag commits to avoid infinite loops
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(gitops):')
    name: Deliver Images & Sync GitOps
    runs-on: ubuntu-latest
    # Wait patiently for both your build steps and security scans to clear cleanly
    needs:
      - docker-build
      - security-scan

    steps:
      - name: Checkout Application Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Packaged Docker Images Artifact
        uses: actions/download-artifact@v4
        with:
          name: syncseatapp-images-${{ github.sha }}
          path: docker-images

      - name: Load Extracted Image Layers into Runner Daemon
        run: docker load -i docker-images/syncseatapp-images.tar

      - name: Tag and Publish Microservices to Docker Hub
        run: |
          TAG="sha-${{ github.sha }}"

          # Bash associative array mapping local image targets onto your cloud repositories
          declare -A images=(
            [booking]="syncseatapp-booking"
            [api-gateway]="synseatapp-api-gateway"
            [mail]="syncseatapp-mail"
            [homepage]="syncseatapp-homepage"
            [frontend]="syncseatapp-frontend"
          )

          for service in "${!images[@]}"; do
            repository="${images[$service]}"

            echo "Pushing: ${DOCKERHUB_USERNAME}/${repository}:${TAG}"

            # Tag local Makefile build layers to your target Docker Hub account destination
            docker tag \
              "syncseatapp-${service}:${TAG}" \
              "docker.io/${DOCKERHUB_USERNAME}/${repository}:${TAG}"

            # Safely deliver the verified image layer stream up to the cloud registry
            docker push \
              "docker.io/${DOCKERHUB_USERNAME}/${repository}:${TAG}"
          done
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Automate Configuration Sync inside GitOps Repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          TAG="sha-${{ github.sha }}"

          # Clone your dedicated deployment repository using your secure access token link
          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/phanivarun05/sync-seat-gitops-gke.git" \
            gitops

          cd gitops

          # Array matching the exact sub-chart blocks inside your main values-dev.yaml
          services=(
            booking
            api-gateway
            mail
            homepage
            frontend
          )

          # Stream-editor locates the block match and updates the tag string safely
          for service in "${services[@]}"; do
            sed -i "/^${service}:/,/^[^[:space:]]/ s/^    tag: .*/    tag: \"${TAG}\"/" \
              values-dev.yaml
          done

          # Set up official GitHub actions bot identification signatures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          # Stage the updated global values configurations sheet
          git add values-dev.yaml

          # Safeguard check: Exits cleanly if no modifications were detected
          if git diff --cached --quiet; then
            echo "No infrastructure configurations changes detected. Skipping push."
            exit 0
          fi

          # Commit and dispatch changes back to your operational main control path
          git commit -m "chore(gitops): update syncseat core cluster images to ${TAG}"
          git push origin main



